<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - Location Tana</title>
    <link rel="stylesheet" href="style-ui.css">
    <style>
        .login-wrapper {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--border-dark, #334155);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .login-card h2 {
            margin-top: 0;
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }
        .form-group input:focus {
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo-container">
            <span style="font-weight: bold; color: #38bdf8; font-size: 1.2rem;">LOCATION TANA</span>
        </a>
        <nav class="main-nav">
            <a href="index.html">← Retour au site</a>
        </nav>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Espace Admin</h2>
            <form id="form-login" onsubmit="connexionAdmin(event)">
                <div class="form-group">
                    <label>E-mail / Utilisateur</label>
                    <input type="email" id="login-email" required placeholder="admin@locationtana.mg">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Se connecter</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script>
        async function connexionAdmin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const { data, error } = await sb.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // Redirection vers le tableau de bord admin
                window.location.href = "admin.html";
            } catch (err) {
                alert("Erreur d'authentification : " + err.message);
            }
        }
    </script>
</body>
</html>
